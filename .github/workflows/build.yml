name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libarchive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: |
          cd build
          ctest --output-on-failure

      - name: CLI smoke test
        run: |
          cd build
          echo "hello from CI" > sample.txt
          ./wrclone.exe a sample.zip sample.txt
          ./wrclone.exe t sample.zip
          ./wrclone.exe x sample.zip -o out
          cat out/sample.txt
          ./wrclone.exe a sample.wrc sample.txt -m5 --solid
          ./wrclone.exe t sample.wrc
          ./wrclone.exe a sample_zstd.wrc sample.txt --zstd --zstd-level 9
          ./wrclone.exe t sample_zstd.wrc

      - name: GUI smoke test
        run: |
          cd build
          powershell -Command "Start-Process -FilePath './wrclone_gui.exe' -ArgumentList '-platform','offscreen'; Start-Sleep -Seconds 5; Get-Process -Name wrclone_gui -ErrorAction SilentlyContinue | Stop-Process -Force"
          ./wrclone.exe a sample.wrc sample.txt --solid
          ./wrclone.exe t sample.wrc
          ./wrclone.exe x sample.wrc -o out2

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: winrar-clone-win64
          path: |
            build/wrclone.exe
            build/wrclone_gui.exe
